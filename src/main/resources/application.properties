spring.application.name=ParkShark

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

spring.flyway.locations=classpath:db/migration

spring.datasource.url=jdbc:postgresql://ec2-15-237-74-163.eu-west-3.compute.amazonaws.com:443/${DB_NAME}?currentSchema=parkshark
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.schemas=parkshark
spring.flyway.default-schema=parkshark

spring.jpa.properties.hibernate.default_schema=parkshark
spring.jpa.hibernate.ddl-auto=validate