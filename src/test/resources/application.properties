spring.datasource.url=jdbc:h2:mem:parkshark;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.schemas=parkshark
spring.flyway.default-schema=parkshark

spring.jpa.properties.hibernate.default_schema=parkshark
spring.jpa.hibernate.ddl-auto=validate